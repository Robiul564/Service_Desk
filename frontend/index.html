<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Desk – live request board</title>
  <meta name="description" content="Submit service requests and follow their progress in real time.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b6e69'/%3E%3Cpath d='M7 17h5l3-7 4 12 3-5h3' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Sign in -->
  <main id="login-view" class="login" hidden>
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Service Desk</h1>
      <p class="login-lead">Sign in to submit requests and watch them move through the queue.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <div class="demo-accounts">
        <p>Demo accounts (password <b>Password123!</b>)</p>
        <div>
          <button type="button" class="chip-btn" data-demo="alice">Alice, operator</button>
          <button type="button" class="chip-btn" data-demo="bob">Bob, operator</button>
          <button type="button" class="chip-btn" data-demo="sam">Sam, supervisor</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Board -->
  <div id="board-view" hidden>
    <header class="topbar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M7 17h5l3-7 4 12 3-5h3" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Service Desk</span>
      </div>
      <div class="topbar-right">
        <span id="conn" class="conn" data-state="connecting" role="status" aria-live="polite"><i></i><span>Connecting</span></span>
        <span class="user"><b id="user-name"></b> <small id="user-role"></small></span>
        <button id="logout" class="btn btn-quiet" type="button">Sign out</button>
      </div>
    </header>

    <main class="board">
      <section class="ledger" aria-label="Request totals">
        <div class="ledger-head">
          <h2 id="scope-title">Requests</h2>
          <p id="ledger-note" class="muted"></p>
        </div>
        <div id="ledger-bar" class="ledger-bar" role="img" aria-label="Distribution of requests by status"></div>
        <dl id="ledger-counts" class="ledger-counts"></dl>
      </section>

      <section class="toolbar" aria-label="Search and filter">
        <div class="field grow">
          <label for="f-q">Search</label>
          <input id="f-q" type="search" placeholder="Title, description or SR-00012" maxlength="100">
        </div>
        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="">All</option><option value="PENDING">Pending</option><option value="IN_PROGRESS">In progress</option>
            <option value="COMPLETED">Completed</option><option value="FAILED">Failed</option><option value="CANCELLED">Cancelled</option>
          </select>
        </div>
        <div class="field">
          <label for="f-priority">Priority</label>
          <select id="f-priority">
            <option value="">All</option><option value="URGENT">Urgent</option><option value="HIGH">High</option>
            <option value="MEDIUM">Medium</option><option value="LOW">Low</option>
          </select>
        </div>
        <div class="field">
          <label for="f-category">Category</label>
          <select id="f-category">
            <option value="">All</option><option value="INSTALLATION">Installation</option><option value="MAINTENANCE">Maintenance</option>
            <option value="REPAIR">Repair</option><option value="INQUIRY">Inquiry</option><option value="OTHER">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="f-sort">Sort by</label>
          <select id="f-sort">
            <option value="newest">Newest</option><option value="oldest">Oldest</option>
            <option value="priority">Priority</option><option value="progress">Progress</option>
          </select>
        </div>
        <button id="new-request" class="btn btn-primary" type="button">New request</button>
      </section>

      <section aria-label="Requests">
        <ul id="rows" class="rows"></ul>
        <div id="empty" class="empty" hidden></div>
        <nav class="pager" aria-label="Pages">
          <button id="prev" class="btn btn-quiet" type="button">Previous</button>
          <span id="page-info" class="muted"></span>
          <button id="next" class="btn btn-quiet" type="button">Next</button>
        </nav>
      </section>
    </main>
  </div>

  <!-- Request details -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-head">
      <div>
        <p id="drawer-ref" class="ref"></p>
        <h2 id="drawer-title"></h2>
      </div>
      <button id="drawer-close" class="icon-btn" type="button" aria-label="Close details">×</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
    <div id="drawer-actions" class="drawer-actions"></div>
  </aside>

  <!-- Create / edit -->
  <dialog id="form-dialog" class="dialog" aria-labelledby="form-title">
    <form id="request-form" novalidate>
      <h2 id="form-title">New request</h2>
      <div class="field">
        <label for="r-title">Title</label>
        <input id="r-title" name="title" maxlength="120" autocomplete="off" aria-describedby="r-title-err">
        <p class="field-error" id="r-title-err" role="alert"></p>
      </div>
      <div class="field">
        <label for="r-description">What needs to be done?</label>
        <textarea id="r-description" name="description" rows="5" maxlength="2000" aria-describedby="r-description-err r-count"></textarea>
        <div class="field-foot"><p class="field-error" id="r-description-err" role="alert"></p><small id="r-count" class="muted">0 / 2000</small></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="r-category">Category</label>
          <select id="r-category" name="category">
            <option value="">Choose…</option><option value="INSTALLATION">Installation</option><option value="MAINTENANCE">Maintenance</option>
            <option value="REPAIR">Repair</option><option value="INQUIRY">Inquiry</option><option value="OTHER">Other</option>
          </select>
          <p class="field-error" id="r-category-err" role="alert"></p>
        </div>
        <div class="field">
          <label for="r-priority">Priority</label>
          <select id="r-priority" name="priority">
            <option value="LOW">Low</option><option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option><option value="URGENT">Urgent</option>
          </select>
        </div>
      </div>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button id="form-cancel" class="btn btn-quiet" type="button">Discard</button>
        <button id="form-submit" class="btn btn-primary" type="submit">Submit request</button>
      </div>
    </form>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
